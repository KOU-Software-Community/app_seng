# Depodaki kontroller yalnızca birinin hatırlaması hâlinde çalışıyordu.
#
# `check:all` altı saniye sürüyor ve 180'den fazla assertion taşıyor; her biri
# gerçekten bir kez yanlış gitmiş bir şeyi koruyor. Kimsenin çalıştırmadığı bir
# kontrol, olmayan bir kontroldür.
name: check

on:
  push:
    branches: ['**']
  pull_request:

# Aynı dala arka arkaya push yapıldığında eskisini iptal et: ikinci push'un
# sonucu zaten birincisininkini geçersiz kılıyor.
#
# `main` hariç. Üç PR arka arkaya merge edilince ilk ikisinin koşusu iptal oldu
# ve o iki commit hiç kontrol edilmemiş kaldı. Dal koşularında bu sorun değil —
# önemli olan dalın son hâli — ama main'de her commit'in yeşil olduğunu bilmek
# gerekiyor, yoksa "hangi commit'te bozuldu" sorusunun cevabı kayboluyor.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` — `npm install` değil. Lock dosyasına birebir uyar ve uymuyorsa
      # sessizce güncellemek yerine hata verir.
      - run: npm ci

      # typecheck · release · schema · html · raffle
      - run: npm run check:all

      # Paketleme ve import hataları typecheck'e takılmıyor: eksik bir dosya ya
      # da çözülemeyen bir modül ancak Metro paketlerken ortaya çıkıyor.
      - run: npx expo export --platform ios

      # Paketin İÇİNDE ne olduğunu okur. `EXPO_PUBLIC_*` değerleri derleme anında
      # gömülüyor, yani yanlış önekli bir anahtar kaynakta görünmüyor ama pakette
      # duruyor. Kendi web paketini derliyor: düz JavaScript, Hermes bytecode
      # değil, ve babel'in gömme davranışı platformdan bağımsız.
      - run: npm run check:bundle
